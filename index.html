<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Aberration Glitch Art</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; border-radius: 8px; }
  input[type=range] { accent-color: #ff4488; width: 100%; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; }
  .ctrl-val { font-family: monospace; font-size: 0.8rem; color: #888; min-width: 36px; text-align: right; }
</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-pink-400 mb-1">Chromatic Aberration Glitch Art</h1>
  <p class="text-gray-500 text-sm mb-4">Real-time RGB channel shift and glitch effects on procedurally generated artwork</p>

  <div class="flex flex-wrap gap-6 items-start">
    <!-- Canvas -->
    <div>
      <canvas id="outputCanvas" width="600" height="400" aria-label="Glitch art canvas"></canvas>
      <div class="mt-2 flex gap-2">
        <button onclick="randomize()" class="bg-pink-700 hover:bg-pink-600 text-white px-4 py-1.5 rounded text-sm font-bold" aria-label="Randomize base image">Randomize</button>
        <button onclick="downloadCanvas()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-1.5 rounded text-sm" aria-label="Download image">Download PNG</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="space-y-5 min-w-[220px]">
      <div>
        <label for="rgbShift" class="block text-sm text-pink-300 mb-1">RGB Shift: <span id="rgbShiftVal" class="ctrl-val">8px</span></label>
        <input type="range" id="rgbShift" min="0" max="40" value="8" aria-label="RGB shift amount in pixels" oninput="updateEffect()">
      </div>
      <div>
        <label for="scanlines" class="block text-sm text-pink-300 mb-1">Scanlines: <span id="scanlinesVal" class="ctrl-val">30%</span></label>
        <input type="range" id="scanlines" min="0" max="100" value="30" aria-label="Scanline intensity" oninput="updateEffect()">
      </div>
      <div>
        <label for="grain" class="block text-sm text-pink-300 mb-1">Noise Grain: <span id="grainVal" class="ctrl-val">20%</span></label>
        <input type="range" id="grain" min="0" max="100" value="20" aria-label="Noise grain amount" oninput="updateEffect()">
      </div>
      <div>
        <label for="glitchBlocks" class="block text-sm text-pink-300 mb-1">Glitch Blocks: <span id="glitchBlocksVal" class="ctrl-val">3</span></label>
        <input type="range" id="glitchBlocks" min="0" max="20" value="3" aria-label="Number of glitch blocks" oninput="updateEffect()">
      </div>
      <div class="border border-gray-700 rounded p-3 text-xs text-gray-500">
        <div class="text-gray-400 mb-1 font-bold">How it works</div>
        <div>• Red channel shifts left</div>
        <div>• Blue channel shifts right</div>
        <div>• Green channel stays centered</div>
        <div>• Scanlines overlay dark horizontal bands</div>
        <div>• Glitch blocks displace row strips</div>
      </div>
    </div>
  </div>
</div>

<script>
const W = 600, H = 400;
const baseCanvas = document.createElement('canvas');
baseCanvas.width = W; baseCanvas.height = H;
const baseCtx = baseCanvas.getContext('2d');
const outCanvas = document.getElementById('outputCanvas');
const outCtx = outCanvas.getContext('2d');

// Separate R/G/B canvases for channel work
const rCanvas = document.createElement('canvas'); rCanvas.width = W; rCanvas.height = H;
const gCanvas = document.createElement('canvas'); gCanvas.width = W; gCanvas.height = H;
const bCanvas = document.createElement('canvas'); bCanvas.width = W; bCanvas.height = H;

let glitchOffsets = [];
let seed = Math.random() * 10000;

function rand(s) {
  // Simple seeded pseudo-random
  let x = Math.sin(s) * 10000;
  return x - Math.floor(x);
}

function randomize() {
  seed = Math.random() * 10000;
  glitchOffsets = [];
  generateBase();
  updateEffect();
}

function generateBase() {
  const ctx = baseCtx;
  ctx.clearRect(0, 0, W, H);

  // Dark background gradient
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, `hsl(${(seed*37)%360},40%,8%)`);
  bg.addColorStop(1, `hsl(${(seed*37+180)%360},40%,12%)`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Random geometric shapes
  const shapes = 18;
  for (let i = 0; i < shapes; i++) {
    const s = seed + i * 137;
    const x = rand(s) * W;
    const y = rand(s+1) * H;
    const r = rand(s+2) * 120 + 20;
    const hue = (rand(s+3) * 360) | 0;
    const sat = (rand(s+4) * 60 + 40) | 0;
    const lit = (rand(s+5) * 40 + 30) | 0;
    const alpha = rand(s+6) * 0.6 + 0.2;
    ctx.globalAlpha = alpha;

    const shape = (rand(s+7) * 3) | 0;
    ctx.fillStyle = `hsl(${hue},${sat}%,${lit}%)`;

    if (shape === 0) {
      // Circle
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    } else if (shape === 1) {
      // Rectangle
      const w2 = rand(s+8) * 200 + 30;
      const h2 = rand(s+9) * 150 + 20;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rand(s+10) * Math.PI);
      ctx.fillRect(-w2/2, -h2/2, w2, h2);
      ctx.restore();
    } else {
      // Triangle
      ctx.beginPath();
      const a = rand(s+8) * Math.PI * 2;
      ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
      ctx.lineTo(x + r * Math.cos(a + 2.094), y + r * Math.sin(a + 2.094));
      ctx.lineTo(x + r * Math.cos(a + 4.189), y + r * Math.sin(a + 4.189));
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Neon lines
  for (let i = 0; i < 8; i++) {
    const s = seed + i * 97 + 500;
    const hue = (rand(s) * 360) | 0;
    ctx.strokeStyle = `hsla(${hue},100%,60%,0.6)`;
    ctx.lineWidth = rand(s+1) * 3 + 1;
    ctx.beginPath();
    ctx.moveTo(rand(s+2) * W, rand(s+3) * H);
    ctx.lineTo(rand(s+4) * W, rand(s+5) * H);
    ctx.stroke();
  }
}

function updateEffect() {
  const rgbShift = parseInt(document.getElementById('rgbShift').value);
  const scanlinesPct = parseInt(document.getElementById('scanlines').value);
  const grainPct = parseInt(document.getElementById('grain').value);
  const glitchCount = parseInt(document.getElementById('glitchBlocks').value);

  document.getElementById('rgbShiftVal').textContent = rgbShift + 'px';
  document.getElementById('scanlinesVal').textContent = scanlinesPct + '%';
  document.getElementById('grainVal').textContent = grainPct + '%';
  document.getElementById('glitchBlocksVal').textContent = glitchCount;

  // Regenerate glitch offsets if count changed
  while (glitchOffsets.length < glitchCount) {
    glitchOffsets.push({
      y: Math.random() * H,
      h: Math.random() * 30 + 5,
      dx: (Math.random() - 0.5) * 60
    });
  }
  glitchOffsets.length = glitchCount;

  // Get base image data
  const baseData = baseCtx.getImageData(0, 0, W, H);
  const bd = baseData.data;

  // Create output image data
  const outData = outCtx.createImageData(W, H);
  const od = outData.data;

  for (let y = 0; y < H; y++) {
    // Glitch block displacement
    let glitchDx = 0;
    for (const gb of glitchOffsets) {
      if (y >= gb.y && y < gb.y + gb.h) { glitchDx = gb.dx; break; }
    }

    for (let x = 0; x < W; x++) {
      const idx = (y * W + x) * 4;

      // Sample R from shifted left
      const rx = Math.max(0, Math.min(W-1, Math.round(x + rgbShift + glitchDx)));
      const ridx = (y * W + rx) * 4;

      // Sample G from center
      const gx = Math.max(0, Math.min(W-1, Math.round(x + glitchDx)));
      const gidx = (y * W + gx) * 4;

      // Sample B from shifted right
      const bx = Math.max(0, Math.min(W-1, Math.round(x - rgbShift + glitchDx)));
      const bidx = (y * W + bx) * 4;

      od[idx]   = bd[ridx];
      od[idx+1] = bd[gidx+1];
      od[idx+2] = bd[bidx+2];
      od[idx+3] = 255;

      // Grain
      if (grainPct > 0) {
        const noise = (Math.random() - 0.5) * grainPct * 2.55;
        od[idx]   = Math.max(0, Math.min(255, od[idx]   + noise));
        od[idx+1] = Math.max(0, Math.min(255, od[idx+1] + noise));
        od[idx+2] = Math.max(0, Math.min(255, od[idx+2] + noise));
      }

      // Scanlines
      if (scanlinesPct > 0 && y % 2 === 0) {
        const dim = 1 - scanlinesPct / 200;
        od[idx]   = od[idx]   * dim;
        od[idx+1] = od[idx+1] * dim;
        od[idx+2] = od[idx+2] * dim;
      }
    }
  }

  outCtx.putImageData(outData, 0, 0);
}

function downloadCanvas() {
  const a = document.createElement('a');
  a.download = 'glitch-art.png';
  a.href = outCanvas.toDataURL('image/png');
  a.click();
}

generateBase();
updateEffect();
</script>
</body>
</html>
